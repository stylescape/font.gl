<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>font.gl Tester</title>
        <!-- Built by `npm run build`; this page lives in dist/html/. -->
        <!-- stylescape (devDependency) styles the demo chrome; font.gl loads
             after it so the fonts under test win. Not part of dist/css. -->
        <link rel="stylesheet" href="../../node_modules/stylescape/css/stylescape.css" />
        <link rel="stylesheet" href="../css/font.gl.css" />
        <style>
            /* Demo-specific only: chrome font, control grid width, specimen. */
            body {
                font-family: var(--font-manrope);
            }

            .controls {
                --ss-l-grid-min: 11.25rem;
                margin-block-end: var(--ss-spacing-6);
            }

            #sample {
                width: 100%;
                min-height: 2em;
                padding-block: var(--ss-spacing-4);
                border: 0;
                border-block: 1px solid var(--ss-color-line);
                background: transparent;
                color: inherit;
                font-size: 40px;
                line-height: 1.2;
                outline: none;
            }
        </style>
    </head>
    <body>
        <main class="ss-c-container ss-c-container--narrow ss-u-py-8">
            <h1 class="ss-t-h1">font.gl Tester</h1>

            <fieldset class="controls ss-l-grid ss-l-grid-auto">
                <label class="ss-c-form__field ss-c-label">
                    Font
                    <select id="font" class="ss-c-select">
                        <option value="manrope">Manrope</option>
                        <option value="quicksand">Quicksand</option>
                        <option value="alvarado">Alvarado</option>
                    </select>
                </label>

                <label class="ss-c-form__field ss-c-label">
                    Size <output id="sizeOut" class="ss-c-form__help"></output>
                    <input id="size" class="ss-c-range" type="range" min="12" max="160" value="40" />
                </label>

                <label class="ss-c-form__field ss-c-label">
                    Weight <output id="weightOut" class="ss-c-form__help"></output>
                    <input id="weight" class="ss-c-range" type="range" />
                </label>

                <label class="ss-c-form__field ss-c-label" id="italControl" hidden>
                    Italic <output id="italOut" class="ss-c-form__help"></output>
                    <input id="ital" class="ss-c-range" type="range" min="0" max="100" value="0" />
                </label>

                <div class="ss-u-flex ss-u-flex-wrap ss-u-gap-12 ss-u-col-span-full" role="radiogroup" aria-label="Text transform">
                    <label class="ss-c-radio__label"><input class="ss-c-radio" type="radio" name="transform" value="none" checked /> Normal</label>
                    <label class="ss-c-radio__label"><input class="ss-c-radio" type="radio" name="transform" value="uppercase" /> Uppercase</label>
                    <label class="ss-c-radio__label"><input class="ss-c-radio" type="radio" name="transform" value="lowercase" /> Lowercase</label>
                    <label class="ss-c-radio__label"><input class="ss-c-radio" type="radio" name="transform" value="capitalize" /> Capitalize</label>
                </div>
            </fieldset>

            <textarea id="sample" class="font-manrope" spellcheck="false" aria-label="Sample text">
The quick brown fox jumps over the lazy dog</textarea
            >
        </main>

        <script>
            // Weight axes per font. Alvarado's `wght` axis runs 0–100 and is
            // driven through `--font-alvarado-wght` (see .font-alvarado).
            const FONTS = {
                manrope: { min: 200, max: 800, value: 400 },
                quicksand: { min: 300, max: 700, value: 400 },
                alvarado: { min: 0, max: 100, value: 25, axes: true },
            };

            const $ = (id) => document.getElementById(id);
            const sample = $("sample");
            const font = $("font");
            const size = $("size");
            const weight = $("weight");
            const ital = $("ital");

            function applyWeight() {
                const spec = FONTS[font.value];
                $("weightOut").textContent = weight.value;
                if (spec.axes) {
                    sample.style.fontWeight = "";
                    sample.style.setProperty("--font-alvarado-wght", weight.value);
                } else {
                    sample.style.removeProperty("--font-alvarado-wght");
                    sample.style.fontWeight = weight.value;
                }
            }

            function applyFont() {
                const spec = FONTS[font.value];
                sample.className = "font-" + font.value;
                weight.min = spec.min;
                weight.max = spec.max;
                weight.value = spec.value;
                $("italControl").hidden = !spec.axes;
                applyWeight();
            }

            font.addEventListener("change", applyFont);
            weight.addEventListener("input", applyWeight);

            size.addEventListener("input", () => {
                sample.style.fontSize = size.value + "px";
                $("sizeOut").textContent = size.value + "px";
            });

            ital.addEventListener("input", () => {
                sample.style.setProperty("--font-alvarado-ital", ital.value);
                $("italOut").textContent = ital.value;
            });

            document.querySelectorAll('input[name="transform"]').forEach((radio) =>
                radio.addEventListener("change", () => {
                    sample.style.textTransform = radio.value;
                }),
            );

            applyFont();
            size.dispatchEvent(new Event("input"));
            ital.dispatchEvent(new Event("input"));
        </script>
    </body>
</html>
