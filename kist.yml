# =============================================================================
# font.gl - Production Build Configuration
# =============================================================================

---

options:
    mode: production
    logLevel: info

# =============================================================================
# Stages
# =============================================================================

stages:

    - name: Build
      description: "Production build for font.gl"

      steps:

            # Clean dist directory
            # -----------------------------------------------------------------
            - name: CleanDistDirectory
              action: DirectoryCleanAction
              options:
                  dirPath: "./dist"

            # Process SCSS to CSS (compressed)
            # -----------------------------------------------------------------
            - name: ProcessMainStylesMinified
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/index.scss"
                  outputFile: "./dist/css/font.gl.min.css"
                  styleOption: "compressed"

            # Process SCSS to CSS (expanded)
            # -----------------------------------------------------------------
            - name: ProcessMainStylesExpanded
              action: StyleProcessingAction
              options:
                  inputFile: "./src/scss/index.scss"
                  outputFile: "./dist/css/font.gl.css"
                  styleOption: "expanded"

            # Copy source files
            # -----------------------------------------------------------------
            - name: CopySrcSCSS
              action: DirectoryCopyAction
              options:
                  srcDir: "./src/scss"
                  destDir: "./dist/scss"

            # Copy fonts
            # -----------------------------------------------------------------
            - name: CopyFonts
              action: DirectoryCopyAction
              options:
                  srcDir: "./src/font"
                  destDir: "./dist/font"

            # Copy HTML
            # -----------------------------------------------------------------
            - name: CopyHTML
              action: DirectoryCopyAction
              options:
                  srcDir: "./src/html"
                  destDir: "./dist/html"

            # Copy license and readme
            # -----------------------------------------------------------------
            - name: CopyLICENSE
              action: FileCopyAction
              options:
                  srcFile: "./LICENSE"
                  destDir: "./dist"

            - name: CopyREADME
              action: FileCopyAction
              options:
                  srcFile: "./README.md"
                  destDir: "./dist"

            # Generate package.json for distribution
            # -----------------------------------------------------------------
            - name: GeneratePackageJSON
              action: PackageManagerAction
              options:
                  packageJsonPath: "./package.json"
                  outputDir: "./dist"
                  fields:
                      - name
                      - version
                      - description
                      - keywords
                      - license
                      - homepage
                      - author
                      - contributors
                      - repository
                      - funding
                  # dist/ is the package root: paths below are relative to it
                  # and override the repo-relative ones in ./package.json.
                  customConfig:
                      main: "scss/index.scss"
                      style: "css/font.gl.css"
                      sass: "scss/index.scss"
                      types: null
                      exports:
                          ".":
                              sass: "./scss/index.scss"
                              style: "./css/font.gl.css"
                              default: "./css/font.gl.css"
                          "./scss": "./scss/index.scss"
                          "./scss/*": "./scss/*"
                          "./css/*": "./css/*"
                          "./font/*": "./font/*"
                          "./package.json": "./package.json"
                      files:
                          - "css/**/*.css"
                          - "scss/**/*.scss"
                          - "font/**/*.{ttf,woff2}"
                          - "font/**/OFL.txt"
                          - "LICENSE"
                          - "README.md"

            # Version synchronization
            # -----------------------------------------------------------------
            - name: SyncVersion
              action: VersionWriteAction
              options:
                  files:
                      - path: "./CITATION.cff"
                        key: "version: "
                      - path: "./VERSION"
                        key: ""  # VERSION holds a bare version
